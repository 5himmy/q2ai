# botconfig.cfg -- Per-bot customization for opentdm bots
#
# Usage: set g_bot_config to a section name to load bots from that section.
#   g_bot_config "BotList"     -- 19 default bots with varied skills
#   g_bot_config "4v4sk7"      -- 7 bots tuned for 4v4 at skill 7
#   g_bot_config ""            -- disabled, uses g_bot_skill presets
#
# Format: \\Name\Model\Skin\16 params\Team\Spawn
#   Tabs between field groups are allowed (stripped by parser).
#
# Parameters (0-15):
#  0  Walk flag         (0-1)   1=walk, 0=always run
#  1  Aiming skill      (0-9)   higher=harder
#  2  Item pickup freq  (0-9)   higher=more aggressive
#  3  Character type    (0-9)   higher=offensive, lower=defensive
#  4  Combat skill      (0-9)   higher=professional
#  5  Rocket jump flag  (0-1)   1=on
#  6  Reaction skill    (0-9)   higher=faster
#  7  Vertical range    (10-180) degrees
#  8  Horizontal range  (10-180) degrees
#  9  Primary weapon    (0-13)  0=default(RL)
# 10  Secondary weapon  (0-13)  0=default(RG)
# 11  Dodge             (0-1)   1=on (depends on combat skill)
# 12  Estimate          (0-1)   1=on (needs param 13)
# 13  Noise check       (0-1)   1=on
# 14  Water visibility  (0-1)   1=can't see through water
# 15  Teamwork          (0-9)
#
# Weapons: 1=Blaster 2=Shotgun 3=SSG 4=MG 5=Chaingun 6=Grenades
#   7=GL 8=RL 9=HB 10=Railgun 11=BFG 12=Plasma 13=Ion Ripper
#
# Team: R or A = team 1, B = team 2
# Spawn: ignored by opentdm (uses g_spawn_bots cvar)
#
# Sections:
#   [BotList]          -- 19 default free-for-all bots
#   [1v1sk1]-[1v1sk10] -- 1v1 duel bots at skill 1-10
#   [2v2sk1]-[2v2sk10] -- 2v2 bots (1 human + 1 bot vs 2 bots)
#   [4v4sk1]-[4v4sk10] -- 4v4 bots (1 human + 3 bots vs 4 bots)

